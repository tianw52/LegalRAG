<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalRAG Data Inspector</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card-available { cursor: pointer; transition: box-shadow 0.15s, transform 0.15s; }
  .card-available:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.12); transform: translateY(-2px); }
</style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 flex flex-col" style="font-size:14px">

<header class="bg-white border-b px-8 py-4 shadow-sm">
  <h1 class="text-lg font-bold text-gray-800">⚖ LegalRAG Data Inspector</h1>
  <p class="text-xs text-gray-400 mt-0.5">Select a dataset to inspect retrieval traces</p>
</header>

<main class="flex-1 px-8 py-10 max-w-4xl mx-auto w-full">
  <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <div class="col-span-full text-sm text-gray-400">Loading datasets…</div>
  </div>
</main>

<script>
const COLOR_RING = {
  blue:   'border-blue-400',
  purple: 'border-purple-400',
  teal:   'border-teal-400',
  rose:   'border-rose-400',
  gray:   'border-gray-300',
};
const COLOR_BADGE = {
  blue:   'bg-blue-100 text-blue-700',
  purple: 'bg-purple-100 text-purple-700',
  teal:   'bg-teal-100 text-teal-700',
  rose:   'bg-rose-100 text-rose-700',
  gray:   'bg-gray-100 text-gray-500',
};
const COLOR_BTN = {
  blue:   'bg-blue-600 hover:bg-blue-700 text-white',
  purple: 'bg-purple-600 hover:bg-purple-700 text-white',
  teal:   'bg-teal-600 hover:bg-teal-700 text-white',
  rose:   'bg-rose-600 hover:bg-rose-700 text-white',
  gray:   'bg-gray-400 text-white',
};

async function init() {
  const datasets = await fetch('/api/datasets').then(r => r.json());
  const grid = document.getElementById('cards');
  grid.innerHTML = '';

  for (const ds of datasets) {
    const ring   = COLOR_RING[ds.color]  || COLOR_RING.gray;
    const badge  = COLOR_BADGE[ds.color] || COLOR_BADGE.gray;
    const btn    = COLOR_BTN[ds.color]   || COLOR_BTN.gray;

    const benchmarkPills = ds.benchmark_names.map(b =>
      `<span class="px-1.5 py-0.5 rounded text-xs font-medium ${badge}">${b}</span>`
    ).join('');

    const runsBadge = ds.available
      ? `<span class="text-xs text-gray-400">${ds.n_runs} run${ds.n_runs !== 1 ? 's' : ''}</span>`
      : '';

    const footer = ds.placeholder
      ? `<div class="mt-4 text-xs text-gray-400 italic">Coming soon</div>`
      : ds.available
      ? `<button onclick="location.href='/inspect?ds=${ds.id}'"
           class="mt-4 w-full py-1.5 rounded-lg text-sm font-medium ${btn} transition-colors">
           Inspect →
         </button>`
      : `<div class="mt-4 text-xs text-gray-400 italic">No evaluation runs found</div>`;

    const card = document.createElement('div');
    card.className = `bg-white rounded-xl border-2 ${ring} p-5 flex flex-col
      ${ds.available && !ds.placeholder ? 'card-available' : 'opacity-50'}`;

    if (ds.available && !ds.placeholder) {
      card.addEventListener('click', e => {
        if (e.target.tagName !== 'BUTTON') location.href = `/inspect?ds=${ds.id}`;
      });
    }

    card.innerHTML = `
      <div class="flex items-start justify-between gap-2 mb-2">
        <div>
          <h2 class="font-bold text-gray-800 text-base leading-tight">${ds.label}</h2>
          ${ds.subtitle ? `<p class="text-xs text-gray-400">${ds.subtitle}</p>` : ''}
        </div>
        ${runsBadge}
      </div>
      <p class="text-xs text-gray-500 mb-3">${ds.description || ''}</p>
      ${benchmarkPills ? `<div class="flex flex-wrap gap-1 mb-1">${benchmarkPills}</div>` : ''}
      ${footer}
    `;
    grid.appendChild(card);
  }
}

init().catch(err => {
  document.getElementById('cards').innerHTML =
    `<div class="text-red-500 text-sm">Failed to load datasets: ${err.message}</div>`;
});
</script>
</body>
</html>
