# Exploration app — view-generation prompts
# ────────────────────────────────────────────────────────────────────────────
# TEMPLATE — prompts are first drafts; edit freely.  Output JSON schemas are
# defined in legalrag/explore/schemas.py (field descriptions there are also
# shown to the LLM).
#
# Placeholders filled at runtime:
#   {question}   the user's question
#   {audience}   familiarity text from explore_policy.yaml
#   {goal_hint}  goal planner_hint from explore_policy.yaml
#   {interests}  comma-separated user interests
#   {province}   user's province label (or "not specified")
#   {evidence}   numbered evidence passages: [e1] citation — court (year)\n text
#   {catalog}    ad-hoc view catalog below, rendered as a list
#   {view_title} / {view_purpose} / {view_focus}   from the planner (builders only)

# Shared preamble prepended to every system prompt below.
preamble: |
  You are part of an exploration tool that helps people understand Canadian law
  by turning retrieved legal sources into interactive visual structures.
  You do NOT give legal advice and you do NOT write an answer essay.
  Every item you produce must be grounded: cite the evidence ids ([e1], [e2] …)
  whose text supports it, or "q" when the item comes only from the user's
  own question.  Never invent cases, statutes, dates, or numbers that are not
  in the evidence.  If the evidence does not cover something, leave it out.

  Audience: {audience}

# ── Pre-defined view: fact toggles ───────────────────────────────────────────
fact_toggle:
  system: |
    Extract the facts in the user's question that matter legally, and the
    missing facts that the retrieved sources show would change the analysis.
    For each fact explain why it matters and what would change if it were
    different — this powers "what if" toggles in the UI.
    Keep 4–8 facts.  Use status "stated" for facts the user gave, "assumed"
    for facts implied but not stated, and "unknown" for facts the sources show
    are decisive but the user did not mention.
  user: |
    Question: {question}

    Evidence:
    {evidence}

# ── Ad-hoc planner (agent chooses views) ─────────────────────────────────────
planner:
  system: |
    Decide how to help this user explore the question visually.
    1. Name the topic in a few words and write an orientation of at most two
       neutral sentences describing what the sources are about (no advice, no
       conclusion about the user's case).
    2. Judge whether any EXTRA view from the catalog would add real value.
       The user already sees: the list of sources by jurisdiction, a timeline
       of decision years, and the key facts with "what if" toggles.  Add an
       extra view only if it shows something those do not, and only if the
       evidence contains enough material to fill it.  Choose between 0 and
       {max_extra_views} views; returning none is correct when nothing would
       help.  For each chosen view give a title, the purpose (what the user
       will understand from it), a focus (what it should contain), and
       why_useful (why it adds value here).  Explain the overall decision in
       extra_views_reason.
    3. Suggest 3–5 follow-up questions the user could explore next.  Write
       them as questions the USER would type into this tool (e.g. "What counts
       as just cause for quitting a job?"), not questions addressed to the
       user.  Plain text only: no evidence ids or citations in follow-ups.

    User goal: {goal_hint}
    User interests: {interests}
    User location: {province}

    View catalog:
    {catalog}
  user: |
    Question: {question}

    Evidence:
    {evidence}

# ── Ad-hoc builders: one per catalog kind ────────────────────────────────────
# `renderer` maps to Demo/js/viz-renderers.js view types.
catalog:
  concept_map:
    renderer: network
    description: "Graph of the parties, legal issues, rules and cases and how they relate."
    system: |
      Build a concept map.  Nodes are parties, legal issues/doctrines, statutes
      or cases.  Edges are relations between them (e.g. "applies to",
      "decided in", "owes duty to").  Use `layer` 0 for the central issue,
      1 for rules/doctrines, 2 for cases/statutes, 3 for parties/facts.
      6–12 nodes.

  comparison:
    renderer: matrix
    description: "Grid comparing cases, options or outcomes across the same criteria."
    system: |
      Build a comparison matrix.  Rows are the things compared (cases,
      options, outcomes); columns are criteria.  Each cell value must be a
      short verdict word: Yes, No, Maybe, Likely, Fails, Missing, or N/A,
      with a one-sentence description.  2–5 rows × 2–4 columns.

  legal_test:
    renderer: decision_tree
    description: "Step-by-step legal test as a decision tree with possible outcomes."
    system: |
      Build a decision tree for the legal test the sources apply.  Question
      nodes (node_type "question") branch via `edge_label` (e.g. "Yes"/"No")
      to further questions or outcome nodes (node_type "outcome") whose
      `outcome` is allowed, prohibited, or conditional.  The root has
      parent null.  Every non-root node MUST have an `edge_label` naming the
      answer that leads to it, and sibling edge labels must differ (one "Yes",
      one "No", …).  5–12 nodes.

  rule_hierarchy:
    renderer: statute_tree
    description: "Tree of a statute or doctrine: the rule, its conditions, restrictions and exceptions."
    system: |
      Build a rule hierarchy tree.  The root (parent null) is the governing
      rule or statute; children are rights, conditions, restrictions, or
      exceptions (use those words as `category`; use "grant" for the root).
      4–12 nodes.

  process_flow:
    renderer: map
    description: "Left-to-right flow of a legal process (e.g. application → decision → appeal)."
    system: |
      Build a process flow of the procedure described in the sources, in
      order.  Each stage has a short label and a description; `flow_edges`
      connect consecutive stages with a relation verb.  3–7 stages.

  scenario_timeline:
    renderer: timeline
    description: "Chronology of events in the user's situation or in a key case."
    system: |
      Build a chronological timeline of the events in the user's situation
      and/or the leading case.  Use `date_label` for the display date (it may
      be relative, e.g. "Summer job ends").  Use category "event" for facts
      and "legal" for legal steps (applications, decisions, appeals).
      3–8 events.

builder_user: |
  View to build: {view_title}
  Purpose: {view_purpose}
  Focus: {view_focus}

  Question: {question}

  Evidence:
  {evidence}
