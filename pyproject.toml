[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "0.1.0"
description = "Modular Legal RAG system backed by OpenSearch"
requires-python = ">=3.11"
dependencies = [
    # OpenSearch
    "opensearch-py>=3.0.0",
    # LLM (any OpenAI-compatible server: Ollama, vLLM, HF router, OpenAI)
    "openai>=1.40.0",          # HTTP client for the LLM server
    "pydantic-ai>=1.0.0",      # structured LLM output (exploration views)
    "pyyaml>=6.0.0",           # prompt / policy YAML loading
    # Embeddings + rerankers (Qwen3-Embedding, Qwen3-Reranker, cross-encoders)
    "sentence-transformers>=3.0.0",
    "transformers>=4.51.0",    # Qwen3 support
    "torch>=2.2.0",
    "huggingface_hub>=0.23.0", # CanLegalRAGBench download
    # Schema / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Utilities
    "tenacity>=8.4.0",              # retry logic
    "structlog>=24.1.0",            # structured logging
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "diskcache>=5.6.0",             # persistent embedding cache for API-based models
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
app = [
    # Exploration API (legalrag/api/app.py). fastapi>=0.130 requires
    # opentelemetry-api>=1.44, which conflicts with logfire's pinned 1.39.
    "fastapi>=0.115,<0.130",
    "uvicorn>=0.30.0",
]
eval = [
    "google-genai>=1.0.0",          # Gemini query rewrite (evaluation/LegalBenchRAG/query_rewrite.py)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["legalrag*", "evaluation*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
